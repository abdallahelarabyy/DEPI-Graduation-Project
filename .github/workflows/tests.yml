name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # The tests use a fake pipeline, so torch/diffusers are not needed in CI.
      - run: pip install fastapi uvicorn python-multipart pillow httpx pytest
      - run: pytest -q
